[project]
name = "qa-lsf"
version = "0.1.0"
description = "Copiloto local de homologação com histórico pesquisável"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
